suite: data
name: tess_transits
origin: heavy
primary_metric: combined_score
task_prompt: >-
  Implement detect(time, flux, flux_err) for one real TESS light curve (sector 61, 10-minute bins, ~3,000 points
  over 27 days, flux normalized to 1, quiet stars with no known planet or binary); return up to 3 (period_days,
  epoch_days, duration_days, score), strongest first, a higher score meaning more likely a planet. The evaluator
  injects planets (SNR 8-20, periods 0.7-13 d, two or more transits) into 40% of curves and eclipsing binaries
  (V-shaped, secondary eclipse, or unequal odd/even depths) into 20%. The threshold is the score 2% of clean
  curves exceed; a planet is recovered when a signal above it matches its period (or half or twice) within 0.5%
  and its epoch within half a duration. combined_score = 0.01 + recall * (1 - 0.5 * share of binaries above the
  threshold); confirm also ranks real confirmed planets against real false positives (real_auc) on unseen curves.
  Each curve gets a freshly loaded module. Only numpy, scipy, math and small stdlib modules may be imported, plus
  lc = sciel.task.asset('lc'); no files, os or dunder attributes. lc has detrend(time, flux, window), bls(time,
  flux, periods, durations), period_grid(time), peaks(result, k), fold, odd_even and secondary (binary tests in
  sigma). Wall limits: smoke 60 s for 24 curves, full 600 s for 480, confirm 1200 s; keep detect near 0.5 s per
  curve. The seed detrends with a one-day median, runs bls and returns the three strongest periods with their box
  SNR as score.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: combined_score
  numerator_units: injection_recovery_h_plus_floor
  denominator: 1.0
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - recall
  - eb_rate
  - threshold
  - real_auc
  - seconds_per_curve
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# The injections come from fixed seeds and the detector sees only arrays, so a deterministic detector scores the
# same on repeats; confirm runs once on the held-out curves.
stochastic: false
confirm_n: 1
smoke_timeout: 60.0
full_timeout: 600.0
confirm_timeout: 1200.0
license: "TESS data from MAST (TESS-SPOC HLSP, sector 61); injection-recovery evaluator written for SCiEL"
paradigms:
  - "a SIGNAL-PROCESSING approach: better detrending (biweight, splines with gap handling, outlier clipping) and a matched filter with limb-darkened transit shapes instead of boxes"
  - "a STATISTICAL approach: calibrated scores that combine transit signal-to-noise with odd-even, secondary-eclipse, shape (U versus V) and single-event-dominance tests"
  - "a SEARCH approach: finer period and duration grids where they pay off, alias resolution between P, P/2 and 2P, and a second search after masking the first signal"
