suite: math
name: third_autocorrelation_absolute_frontier
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement module-level step_heights() returning 1 to 65536 finite heights h, which may be negative, of a
  step function with n equal steps on [-1/4,1/4]. Minimize upper_bound = 2n max(abs(convolve(h,h))) /
  sum(h)^2, the Matolcsi-Vinuesa bound on the autoconvolution constant (absolute value inside the
  maximum); sum(h) must be nonzero. combined_score = 1.4599890469 / upper_bound, the best verified value
  as of October 2026 (AlphaEvolve PR 13); above 1 is a record. Scoring is exact on binary64 heights as
  rationals, with no tolerance; a nonzero height below 2**-60 of the largest in absolute value is invalid.
  Stdlib, NumPy and SciPy are available. Wall limits: smoke 30 s, full 600 s, confirm 3 repeats in 1800 s
  keeping the worst; use reproducible seeds. The objective is importable, so build the search on it rather
  than rewrite it: steps = sciel.task.asset('steps') has bound(h) (fast), exact_bound(h) (as scored),
  smooth_bound(h, beta) and subgradient(h) (value and gradient in h), active(h) (lags at the maximum),
  refine(h, k) (each step split in k, same bound), resample(h, n) and clean(h) (valid heights). The seed
  continues the best construction in its population view, otherwise frontier = sciel.task.asset('frontier'),
  whose heights() are the best earlier construction (800 steps, bound 1.4578548849), and descends the smooth
  bound for half its stage time.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: inverse_bound
  numerator_units: reciprocal_upper_bound
  denominator: 0.6849366453284725
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - upper_bound
  - inverse_bound
  - steps
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different step functions on repeats; confirm keeps
# the worst of three, so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 30.0
full_timeout: 600.0
confirm_timeout: 1800.0
license: "Problem from Georgiev, Gomez-Serrano, Tao, Wagner (arXiv 2511.02864); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: an explicit closed-form or structured step function (known extremal shapes, symmetric profiles, sparse combs)"
  - "an OPTIMIZATION approach: a good initial profile refined by linear programming or gradient methods on the exact discrete objective"
  - "a GLOBAL-STOCHASTIC approach: multi-restart search over resolutions and profiles, keeping the best under the time budget"
