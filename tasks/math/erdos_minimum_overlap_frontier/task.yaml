suite: math
name: erdos_minimum_overlap_frontier
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement module-level step_heights() returning 1 to 65536 heights h in [0,1] of a step function on [0,2] with n
  equal steps and integral 1, i.e. sum(h) exactly n/2. It bounds the Erdos minimum overlap constant from above: C <=
  (2/n) max(correlate(h, 1-h, mode='full')). Minimize this upper_bound. combined_score = 0.3808564043546676 /
  upper_bound, the best known value as of October 2026 (NIGHTFALL-DevinWright, EinsteinArena solution 2628); above 1
  is a record. Scoring is exact on binary64 heights as rationals, with no tolerance: the sum must equal n/2 as
  rationals, and a height within 2**-60 of 0 or 1 must equal it. Stdlib, NumPy and SciPy are available. Wall limits:
  smoke 30 s, full 600 s, confirm 3 repeats in 1800 s keeping the worst; use reproducible seeds. steps =
  sciel.task.asset('steps') has bound(h) (fast), exact_bound(h) (as scored), smooth_bound(h, beta) and subgradient(h)
  (value and gradient in h), active(h) (shifts at the maximum), refine(h, k) (each step split in k, same bound),
  resample(h, n), valid(h) and clean(h) (valid heights: clipped, shifted to sum n/2, on multiples of 2**-52 with the
  sum closed exactly); frontier = sciel.task.asset('frontier') has heights(), that construction (2048 steps, bound
  0.38085640435466767 exactly scored). The seed returns it on the first evaluation; afterwards it perturbs the
  construction in its population view, re-optimizes for half its stage time and returns the result even below the
  start: a distinct lower output is admitted, a repeat is not useful.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: inverse_bound
  numerator_units: reciprocal_upper_bound
  denominator: 2.625661505402343
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - upper_bound
  - inverse_bound
  - steps
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different step functions on repeats; confirm keeps
# the worst of three, so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 30.0
full_timeout: 600.0
confirm_timeout: 1800.0
license: "Problem from Georgiev, Gomez-Serrano, Tao, Wagner (arXiv 2511.02864), constant 1b of Tao's optimization problems; construction of NIGHTFALL-DevinWright (EinsteinArena solution 2628); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: an explicit closed-form or structured step function (known extremal shapes, symmetric profiles, sparse combs)"
  - "an OPTIMIZATION approach: a good initial profile refined by linear programming or gradient methods on the exact discrete objective"
  - "a GLOBAL-STOCHASTIC approach: multi-restart search over resolutions and profiles, keeping the best under the time budget"
