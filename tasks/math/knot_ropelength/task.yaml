suite: math
name: knot_ropelength
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement candidate() returning {"P": p, "Q": q, "R": R, "h": h, "outer": [a0, a1, b1, ...], "inner": [i0, ...],
  "phase": [p1, ...]}: two coaxial helix axes c R e(t) + h t ez (c = +-1, R <= h), each with an outer strand at radius
  a(u) and an inner one at -i(u) in the axis Frenet frame at angle v(u) = u + sum p_k sin k u (at most 6 p_k, sum
  |p_k| <= 1), u = N t, N = P / Q (gcd 1, Q <= 64), a, i > 0 even trig polynomials of order <= 6 in u (every sine
  coefficient b_k must be 0, or the caps do not fit); each strand must climb (Z' > 0). Closed by PR 324's caps this is
  T(2, 4Pn + 3), so Tao's 22b (alternating knot ropelength per crossing) has C_22b <= B = (length per crossing) /
  thickness. Minimize B. combined_score = 7.0875532 / B (Pinho's phase-modulated superhelix of PR 347 as scored here;
  his claim 7.087559024); above 1 is a record. Scoring is certified: thickness = min(curvature radius, R - max radius,
  half the self-distance past short arcs) by branch and bound with derivative sup norms. Wall limits: smoke 300 s,
  full 600 s, confirm 3 repeats in 1800 s keeping the worst; scoring takes up to 90 s. helix =
  sciel.task.asset('helix') has value(candidate) (float B, 0.2-2 s), certify (as scored), make, load(output); frontier
  = sciel.task.asset('frontier').candidate() is PR 347's: N = 331/6, six cosine orders per radius, four phase orders.
  The seed returns it first; later it moves N or kicks a harmonic or phase term, re-optimizes for 0.4 of its stage
  time and returns it even if worse: a repeat is useless.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: upper_bound
  numerator_units: ropelength_per_crossing
  denominator: 7.0875532
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - upper_bound
  - length_per_crossing
  - thickness
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different superhelices on repeats; confirm keeps the worst of three,
# so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 300.0
full_timeout: 600.0
confirm_timeout: 1800.0
license: "Constant 22b of Tao's optimization constants (teorth/optimizationproblems); four-strand superhelix of Huh, Kim and Oh (2018), unequal radii of Y. Li (2026), construction and caps of R. Pinho (rpinho/math-certificates, PR 324); modulated radii of SCiEL (PR 342); phase modulation and higher orders of R. Pinho (PR 347); thickness theorem of Cantarella, Kusner and Sullivan (2002); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: radius profiles a(u), i(u) and a twist phase v(u) with harmonics that pull the strands apart exactly where the contact or curvature constraint binds, spending length only there"
  - "an OPTIMIZATION approach: joint local search over R, h and the Fourier coefficients on the float estimate, at many rationals N = P / Q, then certify the best"
  - "an EXHAUSTIVE approach: scanning N = P / Q over small Q with the constant-radius optimum at each, then refining the best basins"
