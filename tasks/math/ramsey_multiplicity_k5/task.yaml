suite: math
name: ramsey_multiplicity_k5
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement module-level kernel() returning q on F_2^n, n <= 8, as (numerators, denominator <= 2**32) with 2^n
  integers in [0, denominator], index z in 0..2^n-1. q is a step graphon on 2^n equal parts, red with probability
  q(x XOR y) between parts x, y (q(0) inside a part); it bounds the Ramsey multiplicity constant c5 (Tao's 89b) by
  the monochromatic K5 density upper_bound = t(K5,W) + t(K5,1-W). Minimize it. combined_score =
  0.0016489705256017126 / upper_bound, R. Pinho's 256-part Cayley graphon (November 2026); above 1 is a record.
  Scoring is exact in integers, no tolerance. NumPy, SciPy. Wall limits: smoke 60 s, full 600 s, confirm 3 repeats
  in 1800 s keeping the worst; scoring n = 8 takes 15 s. cayley = sciel.task.asset('cayley') has
  value_and_gradient(q) (float, 0.1 s), exact_value(kernel), snap(q, bits) (valid kernel), as_float(kernel),
  load(output) (kernel of a population output), lift(q) and relabel(q, matrix) (same density); frontier =
  sciel.task.asset('frontier').kernel() is Pinho's: 1 on 120 entries, 2648/4041 on 16, else 0, a strict local
  minimum. The seed returns it first; afterwards it flips entries of its population view's kernel, re-optimizes for
  0.4 of its stage time and returns the result even if worse: a distinct output is admitted, a repeat is not useful.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: inverse_bound
  numerator_units: reciprocal_upper_bound
  denominator: 606.4389778192658
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - upper_bound
  - inverse_bound
  - dimension
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different kernels on repeats; confirm keeps the worst of three, so a
# record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 60.0
full_timeout: 600.0
confirm_timeout: 1800.0
license: "Problem from Tao's optimization constants (constant 89b, teorth/optimizationproblems PR 277 and 307); construction of R. Pinho (github.com/rpinho/math-certificates, c89b/round4); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: an explicit Cayley kernel from coding theory or quadratic forms over F_2 (Thomason-type graphs, folded Hamming layers, unions of cosets)"
  - "an OPTIMIZATION approach: a good kernel refined by projected gradient or L-BFGS-B on the float density, with discrete flips of entries between 0 and 1"
  - "a GLOBAL-STOCHASTIC approach: multi-restart search over dimensions, coordinate changes and 0/1 patterns, keeping the best under the time budget"
