suite: math
name: sunflower_free_capacity
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement block() returning {"nodes": [...], "ports": [p, q]}: a Sperner family on n <= 62 points with no
  3-sunflower (A&B = A&C = B&C) and two ports. Chaining copies q -> p (DEGKM gluing lemma) bounds Tao's constant 49a
  from below: mu_3 >= rho^(1/(n-2)), rho the Perron root of [[N10, N11], [N00, N01]], N_ab = #members with [p in D] =
  a, [q in D] = b, all >= 1. Maximize it. combined_score = lower_bound / 1.5678599024 (Koshta 2026, 252292 sets, 28
  points); above 1 is a record. Sets are int bitmasks. A node is a leaf {"n": n, "sets": [...]} or {"glue": [i, a, j,
  b], "sets": [...]}: the glue of earlier nodes i, j at points a, b, members (X-a)|(Y-b) with [a in X] != [b in Y],
  points of i minus a then of j minus b, plus explicit sets; the block is the last node. Scoring is exact: the lemma
  covers glues; each explicit set is checked against its node, leaves exhaustively (caps: 4e6 members/node, 6e8
  set-checks). Wall: smoke 300 s, full 900 s, confirm 3x in 2700 s (worst kept); the record checks in 75 s. sf =
  sciel.task.asset('sunflower') has members(block) and families(block), glue(...), port_counts(fam, p, q), rate(N, n),
  value(block) (fast), exact_value(block) (as scored), why_not(fam, n, E) and addable(fam, n, E) (exact one-set test,
  0.1 s) and load(output); known = sciel.task.asset('known') has F() and H() (Cla2026 blocks) and record(). The seed
  returns record() on the first evaluation; afterwards it drops a few explicit sets of its population view's block,
  bars them, re-adds sets greedily for 0.3 of its stage time and returns the result even if lower; repeats are
  useless.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: lower_bound
  numerator_units: chain_growth_rate
  denominator: 1.5678599024
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - lower_bound
  - points
  - members
  - record
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different blocks on repeats; confirm keeps the worst of three, so a
# record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 300.0
full_timeout: 900.0
confirm_timeout: 2700.0
license: "Constant 49a of Tao's optimization problems; gluing lemma of Deuber, Erdos, Gunderson, Kostochka, Meyer (1997), chain count of IRSI2026, families of Cla2026, block of Koshta (Kos2026); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: new small Sperner sunflower-free base families (symmetric designs on graph edges or Z_p, orbits of a group action) glued into trees with pendants at chosen points"
  - "an AUGMENTATION approach: adding explicit sets to a glued block (sets with an empty pendant part, flips of members), each checked exactly, since every new set raises a port count"
  - "a STRUCTURAL approach: changing the gluing tree (which nodes, which points, which ports), trading points per period against port counts"
