suite: math
name: first_autocorrelation_frontier
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement module-level step_heights() returning 1 to 65536 finite non-negative heights h of a step function f with
  n equal steps on [-1/4,1/4]. It bounds the first autocorrelation constant from above: C1 <= max_t (f*f)(t) /
  (integral f)^2 = 2n max(convolve(h,h)) / sum(h)^2. Minimize this upper_bound. combined_score = 1.502743486709583
  / upper_bound, the best known value as of October 2026 (Atris, EinsteinArena solution 2615); above 1 is a record.
  Scoring is exact on binary64 heights as rationals, with no tolerance; a nonzero height below 2**-60 of the largest
  is invalid. Stdlib, NumPy and SciPy are available. Wall limits: smoke 60 s, full 600 s, confirm 3 repeats in 1800 s
  keeping the worst; scoring 65536 steps takes 8 s. Use reproducible seeds. steps = sciel.task.asset('steps') has
  bound(h) (fast), exact_bound(h) (as scored), smooth_bound(h, beta) and subgradient(h) (value and gradient in h),
  active(h) (lags at the maximum), refine(h, k) (each step split in k, same bound), resample(h, n), clean(h) (valid
  heights) and load(output) (heights of a population output); frontier = sciel.task.asset('frontier') has heights(),
  Atris's construction (65536 steps, bound 1.5027434867095835 exactly scored). The seed returns it on the first
  evaluation; afterwards it perturbs the construction in its population view, re-optimizes for half its stage time
  and returns the result even below the start: a distinct lower output is admitted, a repeat is not useful.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: inverse_bound
  numerator_units: reciprocal_upper_bound
  denominator: 0.6654495653077869
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - upper_bound
  - inverse_bound
  - steps
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different step functions on repeats; confirm keeps
# the worst of three, so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 60.0
full_timeout: 600.0
confirm_timeout: 1800.0
license: "Problem from Georgiev, Gomez-Serrano, Tao, Wagner (arXiv 2511.02864), constant 1a of Tao's optimization problems; construction of Atris (EinsteinArena solution 2615); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: an explicit closed-form or structured step function (known extremal shapes, symmetric profiles, sparse combs)"
  - "an OPTIMIZATION approach: a good initial profile refined by linear programming or gradient methods on the exact discrete objective"
  - "a GLOBAL-STOCHASTIC approach: multi-restart search over resolutions and profiles, keeping the best under the time budget"
