suite: math
name: third_autocorrelation_absolute_frontier3
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement module-level step_heights() returning 1 to 163840 finite heights h, which may be negative, of a step
  function with n equal steps on [-1/4,1/4]. Minimize upper_bound = 2n max(abs(convolve(h,h))) / sum(h)^2, the
  Matolcsi-Vinuesa bound on the autoconvolution constant (absolute value inside the maximum); sum(h) must be
  nonzero. combined_score = 1.4547276645287506 / upper_bound, the best published value (teorth/optimizationproblems
  PR 312, November 2026, 81920 steps); above 1 is a record. Scoring is exact on integers: h is scaled to largest
  absolute value 2**31-1 and rounded (integers up to 2**40 on at most 98304 steps are kept). NumPy and SciPy are
  available. Wall limits: smoke 30 s, full 600 s, confirm 3 repeats in 1800 s keeping the worst. Build on
  steps = sciel.task.asset('steps'): bound(h), exact_bound(h) (as scored), smooth_bound(h, beta), subgradient(h),
  descend(h, beta, iters) (L-BFGS on the soft maximum), active(h), refine(h, k), resample(h, n), clean(h) and
  decode(output) (heights of a population output); frontier = sciel.task.asset('frontier').heights() is the PR 312
  construction. Its bound fell with the grid (1.455683 at 10240 steps, 1.454728 at 81920), so 163840 steps may go
  lower. The seed returns it first, then perturbs a population construction, descends with beta doubling for half
  its stage time and returns the result even if worse, since a distinct output is admitted.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: inverse_bound
  numerator_units: reciprocal_upper_bound
  denominator: 0.6874138880997657
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - upper_bound
  - inverse_bound
  - steps
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different step functions on repeats; confirm keeps
# the worst of three, so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 30.0
full_timeout: 600.0
confirm_timeout: 1800.0
license: "Problem from Georgiev, Gomez-Serrano, Tao, Wagner (arXiv 2511.02864); starting construction from teorth/optimizationproblems PR 312 (Julsgaard); evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: an explicit closed-form or structured step function (known extremal shapes, symmetric profiles, sparse combs)"
  - "an OPTIMIZATION approach: a good initial profile refined by linear programming or gradient methods on the exact discrete objective"
  - "a GLOBAL-STOCHASTIC approach: multi-restart search over resolutions and profiles, keeping the best under the time budget"
