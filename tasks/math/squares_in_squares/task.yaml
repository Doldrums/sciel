suite: math
name: squares_in_squares
origin: math
primary_metric: combined_score
task_prompt: >-
  packings() returns {n: n rows [x, y, angle]} for each n in sis.targets() (all 40 sis.SLICE n in full, 2 in
  smoke): unit squares, centre, angle in radians, disjoint interiors. Minimize L = max(max_x-min_x, max_y-min_y)
  over all corners. Finite, |x|,|y| <= 1e4, |angle| <= 100. The Kaggle metric checks reprs exactly: touching
  tilted squares are rejected, leave 1e-12 gaps. A missing or rejected n, or one within 1e-6 of the bar's L,
  counts at the bar (sis.SEED_L: per-n best of 12 public entries); combined_score = bar excess sum / counted
  excess sum, excess = L/sqrt(n)-1, above 1 beats the bar. Each n = k^2+j, j <= k: a k x k grid holds k^2 and the
  j extra squares force L > k; the bars fit them by tilting part of the packing: a band of 45-degree squares along
  the diagonal between two staircase grids (201, 963), a band or corner blocks at 24-30 degrees (260, 175, 299),
  mixed angles when j is near k (110, 462). Squeezing the bars gains little; new constructions win. Stdlib, NumPy,
  SciPy; no open/exec/getattr/dunders. Walls: smoke 75 s, full 300 s, confirm 3 x 320 s keeping the worst; read
  SCIEL_STAGE_SECONDS, stop 15 s early. sis = sciel.task.asset('sis'): construct(n, family, angle, width, offset,
  span, phase) (band or corners; valid packing, L), seed(n), best(m), certify(p), side, min_gap, gaps, contacts,
  rattlers, normalize, remove, grow, decode. squeeze = sciel.task.asset('squeeze'): squeeze(p, rounds, step, gap,
  deadline, free) (LP: repair, shrink L), boundary, group, jiggle. Outputs in population() carry delta[n] = L -
  bar L and binds[n], the extent (x/y) setting L.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: combined_score
  numerator_units: bar_excess_sum_over_counted_excess_sum
  denominator: 1.0
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - excess_sum
  - kaggle_total
  - n_improved
  - n_worse
  - n_invalid
  - best_gain
  - best_gain_n
  - validity
  - progress
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different packings on repeats; confirm keeps the worst of three,
# so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 75.0
full_timeout: 300.0
confirm_timeout: 960.0
license: "Kaggle Squares in Squares (Google, 2026): metric unchanged, public submissions as external data; slice and evaluator written for SCiEL"
paradigms:
  - "a STRUCTURED approach: explicit families for n = k^2 + j built with sis.construct or new ones: a band of squares tilted at 45 degrees or at a solved angle along the diagonal between two staircase grids, tilted blocks in two corners, several bands; search the family's parameters (angle, width, offset, span, phase), then squeeze the best"
  - "a NEIGHBOUR-N approach: build n from the public packings of larger m by dropping squares and squeezing, from smaller n by strip growth and insertion into the largest holes, or by transplanting the corner structure of one n into another"
  - "a GLOBAL-STOCHASTIC approach: basin hopping on the boundary and the tilted squares: rotate or swap groups, remove and reinsert squares, re-squeeze and keep the best per n"
