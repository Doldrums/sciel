suite: math
name: barnard_steinerberger
origin: math
primary_metric: combined_score
task_prompt: >-
  Implement module-level step_weights() returning (K, w): integer 1 <= K <= 65536 and at most min(2K, 81920)
  finite non-negative binary64 weights w (or integers up to 2**53) of f = sum_i w_i 1[i/K,(i+1)/K). Maximize
  lower_bound = K min_{0<=k<=K} sum_i w_i w_{i+k} / (sum w)^2, a lower bound on the Barnard-Steinerberger
  constant (Tao's constant 1c); the autocorrelation of f is linear between multiples of 1/K, so its minimum over
  shifts in [0,1] is at some k/K. combined_score = lower_bound / 0.4103779774, the Lean-checked
  atom-plus-density limit of hashiqiqixian (2026); above 1 beats every known value. Tao's table lists rozetyp's
  K = 6144 step function (0.4103287175). Scoring is exact in integers, no tolerance; a nonzero weight below
  2**-60 of the largest is invalid. Stdlib, NumPy, SciPy. Wall limits: smoke 60 s, full 300 s, confirm 3 repeats in 960 s keeping the
  worst; scoring 65536 cells takes 6 s. corr = sciel.task.asset('corr') has value(K, w) (fast), exact_value(K,
  w) (as scored), smooth_value(K, w, beta) and supergradient(K, w) (value and gradient in w), active(K, w) (lags
  at the minimum), refine(K, w, m) (cells split in m, same bound), clean(K, w) (valid weights) and load(output)
  ((K, w) of a population output). known = sciel.task.asset('known') has rozetyp() and hashiqiqixian(K), that
  measure on K cells (0.4103651781 at K = 65536). The seed returns hashiqiqixian(65536) first; then it perturbs
  its population view's construction, re-optimizes for half its stage time and returns the result even below the
  start: a distinct lower output is admitted, a repeat is not useful.
research_metric:
  kind: validity_gated_ratio
  score_units: dimensionless
  numerator_case: lower_bound
  numerator_units: autocorrelation_mass_ratio
  denominator: 0.4103779774321215
  validity_case: validity
  valid_value: 1.0
  invalid_score: 0.0
  invalid_numerator_value: 0.0
  invalid_numerator_semantics: penalty_sentinel_not_physical_measurement
output_identity:
  schema: sciel-output-identity-adapter/1
  adapter: canonical-json/1
  artifact: full_output
  input_scope: task_fixed
  seed_scope: unpaired
case_metrics:
  - lower_bound
  - K
  - steps
  - validity
  - b_dispersion
  - b_boundary_frac
  - b_contact
  - b_offset
  - b_concentration
  - b_structure
tiers:
  - smoke
  - full
  - confirm
resources: cpu
# Searches that draw unseeded randomness return different step functions on repeats; confirm keeps
# the worst of three, so a record must survive its own repetition.
stochastic: true
confirm_n: 3
smoke_timeout: 60.0
full_timeout: 300.0
confirm_timeout: 960.0
license: "Problem 6 of Georgiev, Gomez-Serrano, Tao, Wagner (arXiv 2511.02864), constant 1c of Tao's optimization problems; constructions of rozetyp and hashiqiqixian; evaluator written for SCiEL"
paradigms:
  - "a CONSTRUCTIVE approach: an explicit profile (a point mass at one end, a gap, a monotone polynomial ramp and a plateau ending near distance 1; difference-base combs)"
  - "an OPTIMIZATION approach: ascent of the soft minimum or a linear program on the active shifts, raising the lowest correlations while refining the grid"
  - "a MULTIRESOLUTION approach: re-optimizing the profile parameters (atom mass, gap, ramp) and resampling them on finer grids, keeping the best exact bound"
