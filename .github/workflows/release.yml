name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build package and task bundle
        run: |
          python -m pip install build
          python -m build
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "bundle/sciel-${version}-tasks"
          cp -r tasks "bundle/sciel-${version}-tasks/tasks"
          tar -czf "dist/sciel-${version}-tasks.tar.gz" -C bundle "sciel-${version}-tasks"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SCiEL ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
