extends: _base.yaml
embed_grid: true
task: oe/heilbronn_triangle
num_islands: 3
budget: 100
milestone_fracs: [0.5, 0.75]
# Use the audited task definitions versioned alongside this engine.
sciel_tasks_repo: null
sciel_tasks_revision: null
wandb:
  enabled: true
  mode: offline
  project: sciel-night
llm:
  models:
    - google/gemini-2.5-flash-lite
    - google/gemini-2.5-flash
  weights: [0.8, 0.2]
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.7
  system_message: >
    Heilbronn triangle problem for n=11. Return 11 DISTINCT points as a numpy array of
    shape (11, 2), all strictly inside the equilateral triangle with vertices (0,0),
    (1,0), (0.5, sqrt(3)/2), i.e. each point must satisfy y>=0, y<=sqrt(3)*x, and
    y<=sqrt(3)*(1-x). Maximize the minimum area over all triples of points; spread the
    points so no three are near-collinear.
