extends: _base.yaml
embed_grid: true
task: oe/circle_packing
num_islands: 3
budget: 80
milestone_fracs: [0.5, 0.75]
# Use the audited task definitions versioned alongside this engine.
sciel_tasks_repo: null
sciel_tasks_revision: null
wandb:
  enabled: true
  mode: offline
  project: sciel-night
llm:
  models:
    - google/gemini-2.5-flash-lite
    - google/gemini-2.5-flash
  weights: [0.8, 0.2]
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.7
  system_message: >
    Pack 26 circles in a unit square to maximize the sum of radii (AlphaEvolve target
    2.635). Improve the construction and radius assignment; circles must stay inside the
    square and not overlap.
    Execution environment: Python's standard library, NumPy and SciPy are
    available. sklearn, cma, GPy and skopt are unavailable; implement other
    optimization methods using the available libraries.
